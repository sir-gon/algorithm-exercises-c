---
services:
  algorithm-exercises-c-test:
    image: algorithm-exercises-c:test
    build:
      context: .
      target: testing
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info} ## (1) ## info | debug
      BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## true | false
    volumes:
      - ./coverage:/app/coverage
    profiles: ["testing"]

  algorithm-exercises-c-lint:
    image: algorithm-exercises-c:lint
    build:
      context: .
      target: lint
    volumes:
      - ./.clang-format:/app/.clang-format
      - ./Makefile:/app/Makefile
      - ./src:/app/src
    profiles: ["lint"]

  markdownlint:
    image: goncl/markdownlint-cli:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
    profiles: ["lint"]

  yamllint:
    image: goncl/yamllint:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
    profiles: ["lint"]

  algorithm-exercises-c-dev:
    image: algorithm-exercises-c:dev
    build:
      context: .
      target: development
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info} ## (1) ## info | debug
      BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## true | false
    volumes:
      - ./:/app
    profiles: ["development"]

  algorithm-exercises-c:
    image: algorithm-exercises-c:latest
    build:
      context: .
      target: production
    # volumes:
    #   - ./:/app
    profiles: ["production"]

## REFERENCES:
## (1) Passing Environment variable with fallback value:
##    https://stackoverflow.com/a/70772707/6366150
##
